[package]
name = "rightlang-macos"
version = "0.1.1"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5.17"
rightlang-core = { path = "../rightlang-core" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
libc = "0.2"

[dev-dependencies]
serde_json = "1.0.154"
