[package]
name = "rightlang-app"
version = "0.1.0"
edition = "2021"
default-run = "phasa"

[[bin]]
name = "phasa"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
dirs = "6.0"
rightlang-core = { path = "../rightlang-core" }
rightlang-macos = { path = "../rightlang-macos" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
mac-notification-sys = "0.6"
tray-icon = "0.26"
muda = "0.21"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile = "3.17"
